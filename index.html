```html
<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">


<title>
他日若相逢，温酒叙余生
</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
}


body{

height:100vh;

overflow:hidden;

background:#05070d;

color:white;

font-family:

"Microsoft YaHei",
sans-serif;

}


/* ===================
星空背景
=================== */


#stars{

position:fixed;

inset:0;

overflow:hidden;

background:

radial-gradient(
circle at center,
#172033,
#05070d 70%
);

}



.star{

position:absolute;

width:2px;

height:2px;

background:white;

border-radius:50%;

opacity:.6;

animation:

twinkle 3s infinite alternate;

}



@keyframes twinkle{

from{

opacity:.2;

transform:scale(.5);

}

to{

opacity:1;

transform:scale(1.5);

}

}



/* ===================
主页
=================== */


.container{

position:relative;

height:100vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

z-index:2;

}


.box{


animation:

fade 2s ease;


}


@keyframes fade{

from{

opacity:0;

transform:translateY(30px);

}

to{

opacity:1;

}

}



.title{


font-size:

clamp(40px,6vw,80px);


font-weight:300;


letter-spacing:12px;


line-height:1.6;


}



.subtitle{

margin-top:30px;

font-size:14px;

letter-spacing:5px;

color:#aaa;

}



.line{

width:80px;

height:1px;

background:#777;

margin:35px auto;

}



.desc{

font-size:14px;

color:#aaa;

letter-spacing:3px;

}



.enter{


margin-top:50px;


display:inline-block;


padding:12px 35px;


border:

1px solid rgba(255,255,255,.3);


border-radius:30px;


color:white;


cursor:pointer;


transition:.3s;


}


.enter:hover{

background:white;

color:black;

}




/* ===================
音乐按钮
=================== */


.music{

position:fixed;

right:30px;

bottom:30px;


width:50px;

height:50px;


border-radius:50%;


background:

rgba(255,255,255,.08);


border:

1px solid rgba(255,255,255,.3);


color:white;


font-size:20px;


cursor:pointer;


z-index:5;

}




/* ===================
留言
=================== */


.message{


position:fixed;


left:50%;

bottom:40px;


transform:

translateX(-50%);


z-index:3;


background:

rgba(0,0,0,.45);


backdrop-filter:blur(10px);


padding:25px;


border-radius:15px;


display:none;


width:320px;


}


.message input,
.message textarea{


width:100%;


margin-bottom:12px;


padding:10px;


background:

rgba(255,255,255,.1);


border:

1px solid rgba(255,255,255,.2);


color:white;


}



.message textarea{

height:80px;

resize:none;

}



.message button{


width:100%;


padding:10px;


background:white;


border:none;


cursor:pointer;


}



.open-message{


position:fixed;


left:30px;

bottom:30px;


z-index:5;


padding:12px 25px;


border-radius:30px;


background:

rgba(255,255,255,.1);


border:

1px solid rgba(255,255,255,.3);


color:white;


cursor:pointer;


}




@media(max-width:600px){


.title{

font-size:40px;

letter-spacing:6px;

}


}



</style>


</head>



<body>



<div id="stars"></div>




<div class="container">


<div class="box">


<div class="title">

他日若相逢

<br>

温酒叙余生

</div>


<div class="line"></div>


<div class="subtitle">

A QUIET PLACE FOR MEMORY

</div>


<div class="desc">

愿多年以后，仍有故事可说。

</div>



<div
class="enter"
onclick="playMusic()"
>

音乐

</div>


</div>


</div>




<!-- 音乐 -->

<audio
id="music"
loop
>

<source src="music.mp3">

</audio>



<button
class="music"
onclick="toggleMusic()"
>

♪

</button>




<!-- 留言入口 -->


<button
class="open-message"
onclick="showMessage()"
>

留言

</button>





<!-- 留言 -->


<div
class="message"
id="message"
>


<form
action="https://formspree.io/f/xvkodavv"
method="POST"
>


<input
name="name"
placeholder="你的名字"
>


<textarea
name="message"
placeholder="写下一句话给我..."
></textarea>



<button>

发送

</button>


</form>


</div>






<script>


/*
动态星空
*/


const stars=
document.getElementById("stars");



for(
let i=0;
i<180;
i++
){


let s=
document.createElement("div");


s.className="star";


s.style.left=
Math.random()*100+"%";


s.style.top=
Math.random()*100+"%";


s.style.animationDelay=
Math.random()*5+"s";


s.style.animationDuration=
2+
Math.random()*5
+"s";



stars.appendChild(s);


}





/*
音乐

默认45%

*/


const music=
document.getElementById("music");


music.volume=0.45;



function playMusic(){


music.play()
.catch(()=>{});


}



function toggleMusic(){


if(music.paused){

music.play();

}

else{

music.pause();

}


}





/*
尝试自动播放

*/


window.onload=function(){


setTimeout(()=>{


music.play()

.catch(()=>{


console.log(
"浏览器禁止自动播放"
);


});


},800);



}





/*
留言

*/


function showMessage(){


let box=
document.getElementById("message");


box.style.display=
box.style.display=="block"
?
"none"
:
"block";


}



</script>


</body>

</html>
```
